<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{.Title}}</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; }
    /* Host fills leftover page space (siblings such as a source strip keep theirs). */
    #shirei-root {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      background: #fff;
    }
    #shirei-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
    #shirei-status {
      position: fixed; left: 12px; bottom: 12px;
      font: 12px/1.4 system-ui, sans-serif;
      color: #888; pointer-events: none;
    }
    {{- if .HasChrome}}
    #shirei-page {
      flex: 0 0 auto;
      padding: 8px 14px;
      font: 12px/1.4 system-ui, -apple-system, sans-serif;
      color: #444;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }
    #shirei-page a {
      color: #1a5fb4;
      text-decoration: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 500;
    }
    #shirei-page a:hover { text-decoration: underline; }
    {{- end}}
  </style>
</head>
<body>
  {{- if .HasChrome}}
  <header id="shirei-page">
    Source:
    <a href="{{.SourceURL}}" target="_blank" rel="noopener noreferrer">{{.SourceLabel}}</a>
  </header>
  {{- end}}
  <div id="shirei-root">
    <canvas id="shirei-canvas" tabindex="0"></canvas>
  </div>
  <div id="shirei-status">Loading…</div>
  <script src="wasm_exec.js"></script>
  <script>
    (async () => {
      const status = document.getElementById("shirei-status");
      try {
        const go = new Go();
        if (!WebAssembly.instantiateStreaming) {
          WebAssembly.instantiateStreaming = async (resp, importObject) => {
            const source = await (await resp).arrayBuffer();
            return await WebAssembly.instantiate(source, importObject);
          };
        }
        const result = await WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject);
        status.textContent = "";
        go.run(result.instance);
      } catch (err) {
        console.error(err);
        status.textContent = "Failed to start: " + err;
      }
    })();
  </script>
</body>
</html>
